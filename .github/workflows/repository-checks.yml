name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Ubuntu 26.04 has no setup-python build for the retired 3.9 line.
          python-version: '3.13'
      - name: Check repository files
        run: python tools/check_repository.py
      - name: Test interaction contract
        run: python -m unittest discover -s tests -v
